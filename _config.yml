title: Graviton
description: Legal documents for the Graviton iOS app.

# No theme. Every GitHub Pages theme paints a sidebar with the site owner's name
# and a link back to the repository, and a privacy policy is not a place to
# advertise where its source lives. The layout in `_layouts/default.html` is
# ours, has no chrome, and cannot grow any.

# app-ads.txt is a record for a crawler, not a page. Jekyll copies it through
# untouched as long as it is not treated as content.
include:
  - app-ads.txt

exclude:
  - README.md
